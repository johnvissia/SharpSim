name: Scheduled Auto-Sync & Grading

on:
  schedule:
    # Runs every 15 minutes automatically
    - cron: '*/15 * * * *'
  # Allows triggering manually from the Actions tab
  workflow_dispatch:

jobs:
  auto_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto-Sync (Odds & Grading)
        run: |
          URL="${{ secrets.PROD_URL }}"
          if [ -z "$URL" ]; then
            URL="https://sharpsim.vercel.app"
          fi
          curl -s -X GET "$URL/api/auto-sync"

