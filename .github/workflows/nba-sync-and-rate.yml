name: NBA Daily Sync & Ratings

on:
  schedule:
    # 6:00 AM UTC (1:00 AM EST / 2:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync_and_rate:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Sync All NBA Teams
        run: |
          curl -f --show-error "${{ secrets.PROD_URL }}/api/sync-all-nba-teams"
      
      - name: 2. Calculate Power Ratings
        run: |
          curl -f --show-error "${{ secrets.PROD_URL }}/api/calculate-power-ratings"
          
      - name: 3. Setup Python for NBA API Sync
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 4. Checkout Code
        uses: actions/checkout@v4

      - name: 5. Install Python Dependencies
        run: pip install firebase-admin pandas nba_api

      - name: 6. Run Player Logs Sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          # Write secret JSON to a temp file and run script
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > firebase-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="firebase-key.json"
          python3 scripts/sync_nba_player_logs.py
          
      - name: 7. Sync and Grade Accuracy
        run: |
          curl -f --show-error "${{ secrets.PROD_URL }}/api/sync-accuracy"
